[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "repo2readme"
version = "1.1.0"
description = "Generate README.md from any GitHub or local repository"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

authors = [
    { name = "Sarowar Jahan Biswas" }
]

dependencies = [
    "click>=8.3.1",
    "rich>=14.2.0",
    "python-dotenv>=1.2.1",
    "pathspec>=0.12.1",
    "langchain-core>=1.2.0",
    "langchain-groq>=1.1.1",
]

[project.urls]
Repository = "https://github.com/agsaru/repo2readme"

[project.optional-dependencies]
google = ["langchain-google-genai>=4.1.2"]
openai = ["langchain-openai>=1.0.0"]
anthropic = ["langchain-anthropic>=1.0.0"]
ollama = ["langchain-ollama"]
dev = ["pytest>=9.1.1"]

[project.scripts]
repo2readme = "repo2readme.cli.main:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["repo2readme*"]


[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
"repo2readme" = ["*.md", "*.txt", "*.json"]
